<style>
  :root {
    --azul: #1e3a8a; --azul-claro: #2563eb; --azul-vivo: #4f46e5;
    --gris-fondo: #eef1f7; --gris-borde: #e4e7eb;
    --texto: #1f2933; --texto-suave: #52606d;
    --verde: #16a34a; --rojo: #dc2626; --naranja: #d97706;
    --gradiente: linear-gradient(135deg, #4f46e5, #2563eb 55%, #1e3a8a);
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    background: var(--gris-fondo); color: var(--texto); margin: 0;
  }
  #app { max-width: 980px; margin: 0 auto; padding: 0 16px 60px; }

  .app-header { display:flex; justify-content:space-between; align-items:flex-end; padding: 26px 8px 14px; }
  .brand-marca {
    display:inline-block; font-size: 11px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
    color: transparent; background: var(--gradiente); -webkit-background-clip: text; background-clip: text;
  }
  .brand-titulo { display:block; font-size: 20px; font-weight: 800; color: var(--azul); letter-spacing: -0.2px; margin-top: 2px; }
  .brand-subtitulo { display:block; font-size: 12px; font-weight: 500; color: #a5b4d6; margin-top: 2px; }
  .btn-link { background:none; border:none; color: var(--azul-claro); cursor:pointer; font-size: 13.5px; text-decoration: underline; padding: 4px; }

  /* Pestañas principales (segmented control) */
  .tabs-principales { display:flex; gap:8px; padding: 4px; margin: 0 8px 18px; background:#e2e7f3; border-radius: 14px; }
  .tab-principal {
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background: transparent; color: var(--texto-suave); border:none; border-radius: 11px;
    padding: 13px 16px; font-size: 14.5px; font-weight: 700; transition: all .18s ease;
  }
  .tab-principal .tab-icono { font-size: 16px; }
  .tab-principal:hover { color: var(--azul); }
  .tab-principal.activo { background: var(--gradiente); color:#fff; box-shadow: 0 4px 14px rgba(37,99,235,.35); }

  .wizard-nav { display:flex; gap:4px; overflow-x:auto; padding: 0 0 16px; }
  .wizard-nav .paso { flex: 0 0 auto; font-size: 11px; padding: 6px 11px; border-radius: 14px; background: #fff; border: 1px solid var(--gris-borde); color: var(--texto-suave); font-weight: 600; }
  .wizard-nav .paso.activo { background: var(--azul-vivo); color: #fff; border-color: var(--azul-vivo); }
  .wizard-nav .paso.completado { background: #e6f4ea; border-color: var(--verde); color: var(--verde); }

  .wizard-body { background:#fff; border-radius: 14px; padding: 30px 32px; box-shadow: 0 2px 10px rgba(30,58,138,0.07); }
  .vista-principal { animation: aparecer .22s ease; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

  /* ------------------------- Pantalla de inicio (landing) ------------------------- */
  .vista-landing { position: relative; overflow: hidden; padding: 18px 4px 8px; }
  .landing-blob {
    position:absolute; border-radius: 50%; filter: blur(50px); opacity: .35; z-index:0; pointer-events:none;
    animation: flotar 9s ease-in-out infinite;
  }
  .landing-blob-1 { width:260px; height:260px; background: radial-gradient(circle, #818cf8, transparent 70%); top:-90px; left:-60px; }
  .landing-blob-2 { width:220px; height:220px; background: radial-gradient(circle, #60a5fa, transparent 70%); bottom:-80px; right:-40px; animation-delay: -4.5s; }
  @keyframes flotar { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.06); } }

  .landing-hero { position:relative; z-index:1; text-align:center; max-width: 620px; margin: 8px auto 34px; }
  .landing-eyebrow {
    display:inline-block; font-size: 11.5px; font-weight: 800; letter-spacing:.5px; text-transform: uppercase;
    background: #eef2ff; color: #4338ca; padding: 5px 14px; border-radius: 20px; margin-bottom: 14px;
  }
  .landing-hero h1 { font-size: 27px; font-weight: 800; color: var(--azul); margin: 0; line-height: 1.3; letter-spacing:-.3px; }

  .landing-cards { position:relative; z-index:1; display:flex; gap: 22px; flex-wrap: wrap; justify-content:center; }
  .landing-card {
    flex: 1 1 260px; max-width: 320px; display:flex; flex-direction:column; align-items:flex-start; text-align:left;
    gap: 6px; background:#fff; border: 1.5px solid var(--gris-borde); border-radius: 16px; padding: 26px 24px;
    cursor:pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  }
  .landing-card:hover { transform: translateY(-6px); box-shadow: 0 16px 32px rgba(37,99,235,.16); border-color: transparent; }
  .landing-card-icono {
    width:52px; height:52px; display:flex; align-items:center; justify-content:center; font-size:24px;
    border-radius: 14px; background: var(--gradiente); margin-bottom: 6px;
    box-shadow: 0 6px 14px rgba(79,70,229,.3); transition: transform .2s ease;
  }
  .landing-card:hover .landing-card-icono { transform: scale(1.08) rotate(-4deg); }
  .landing-card-titulo { font-size: 16.5px; font-weight: 800; color: var(--texto); }
  .landing-card-desc { font-size: 13px; color: var(--texto-suave); line-height: 1.5; }
  .landing-card-cta { margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--azul-vivo); }
  .step h2 { color: var(--azul); margin-top: 0; font-size: 20px; }
  .hint { color: var(--texto-suave); font-size: 13.5px; margin-top: -6px; }
  .hidden { display: none !important; }

  label { display:block; margin-bottom: 14px; font-size: 13px; font-weight: 600; color: var(--texto-suave); }
  input, select, textarea {
    width: 100%; margin-top: 6px; padding: 10px 11px; border: 1px solid var(--gris-borde);
    border-radius: 8px; font-size: 14px; font-family: inherit; color: var(--texto); transition: border-color .15s;
  }
  input:focus, select:focus, textarea:focus { outline:none; border-color: var(--azul-claro); box-shadow: 0 0 0 3px rgba(37,99,235,.12); }
  textarea { resize: vertical; }
  .grid-2 { display:grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }

  .step-actions { display:flex; gap:10px; margin-top: 24px; flex-wrap: wrap; }
  button { cursor:pointer; border:none; border-radius: 8px; padding: 11px 20px; font-size: 14px; font-weight: 700; transition: transform .08s ease, box-shadow .15s ease; }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--azul-claro); color: #fff; }
  .btn-primary:hover { background: var(--azul); }
  .btn-secondary { background: #fff; color: var(--texto-suave); border: 1px solid var(--gris-borde); }
  .btn-secondary:hover { border-color: var(--azul-claro); color: var(--azul-claro); }
  .btn-generar { background: var(--gradiente); color: #fff; padding: 15px 28px; font-size: 15px; box-shadow: 0 4px 14px rgba(37,99,235,.3); }
  .btn-generar:hover { box-shadow: 0 6px 18px rgba(37,99,235,.4); }
  .btn-generar:disabled { opacity: 0.6; cursor: not-allowed; box-shadow:none; }

  .modulos-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .modulo-card { border: 1.5px solid var(--gris-borde); border-radius: 10px; padding: 13px 15px; display:flex; align-items:flex-start; gap:10px; cursor:pointer; transition: all .15s; }
  .modulo-card:hover { border-color: #b4c6f4; }
  .modulo-card.seleccionado { border-color: var(--azul-claro); background: #eff6ff; }
  .modulo-card input { width:auto; margin: 3px 0 0; }
  .modulo-card .titulo { font-weight:700; }
  .modulo-card .desc { font-size: 12px; color: var(--texto-suave); font-weight:400; }

  .modulo-en-curso { font-size: 13px; color: var(--azul-claro); font-weight:700; text-transform: uppercase; margin-bottom: 10px; letter-spacing:.3px; }
  .pregunta-actual .texto-pregunta { font-size: 17px; font-weight: 700; margin-bottom: 4px; }
  .pregunta-actual .ayuda { font-size: 13px; color: var(--texto-suave); margin-bottom: 14px; }
  .opciones-pregunta { display:flex; flex-direction:column; gap: 8px; margin-bottom: 18px; }
  .opcion-btn { text-align:left; background:#fff; border: 1.5px solid var(--gris-borde); padding: 13px 15px; border-radius: 9px; font-weight: 600; transition: all .12s; }
  .opcion-btn:hover { border-color: var(--azul-claro); background: #f5f9ff; transform: translateX(2px); }
  .opcion-btn.marcada { border-color: var(--azul-claro); background: #eff6ff; }
  .barra-progreso { height:6px; background: var(--gris-borde); border-radius:3px; margin-bottom: 20px; overflow:hidden; }
  .barra-progreso-fill { height:100%; background: var(--gradiente); transition: width .3s; }

  .tarjeta-resumen { border:1px solid var(--gris-borde); border-radius:10px; padding:18px; margin-bottom:14px; }
  .tarjeta-resumen h3 { margin:0 0 8px; color: var(--azul); font-size: 16px; }
  .tarjeta-resumen.contexto-general { background: #f7f9fe; border-color: #dbe4fb; }
  .contexto-general dl { display:grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin: 8px 0 0; }
  .contexto-general dt { font-size: 11.5px; font-weight:700; color: var(--texto-suave); text-transform: uppercase; letter-spacing:.3px; }
  .contexto-general dd { margin: 2px 0 0; font-size: 13.5px; }
  .badge-madurez { display:inline-block; font-size:11px; padding:2px 9px; border-radius: 10px; color:#fff; margin-left:8px; font-weight:700; }
  .badge-baja { background: var(--rojo); } .badge-media { background: var(--naranja); } .badge-alta { background: var(--verde); }
  .badge-sin-determinar { background: #9aa5b1; }
  .etiquetas { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .etiqueta { background:#eef2ff; color:#3730a3; font-size:12px; padding:3px 9px; border-radius: 10px; font-weight:600; }

  .respuestas-detalle { margin-top: 12px; }
  .respuestas-detalle summary { cursor:pointer; font-size: 12.5px; color: var(--azul-claro); font-weight:700; }
  .respuesta-item { display:flex; justify-content:space-between; gap: 14px; padding: 7px 0; border-bottom: 1px dashed var(--gris-borde); font-size: 13px; }
  .respuesta-item strong { color: var(--texto); font-weight:600; }
  .respuesta-item span { color: var(--texto-suave); text-align:right; }

  .tabs { display:flex; gap:6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn { background:#fff; border:1px solid var(--gris-borde); padding: 8px 14px; border-radius: 7px; font-size:13px; font-weight:600; }
  .tab-btn.activo { background: var(--azul-claro); color:#fff; border-color: var(--azul-claro); }

  .bloque-revision { margin-bottom: 18px; }
  .bloque-revision h4 { margin-bottom: 4px; color: var(--azul); font-size: 14px; }
  .bloque-revision textarea { min-height: 70px; }
  .bloque-revision textarea.textarea-grande { min-height: 170px; }
  .fila-origen { font-size:11px; color: var(--texto-suave); margin-top: 2px; }
  .origen-tag { padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight:700; margin-right:4px; }
  .origen-CLIENTE { background:#dcfce7; color:#166534; }
  .origen-BASE_CONOCIMIENTO { background:#dbeafe; color:#1e40af; }
  .origen-INFERENCIA_IA { background:#fef3c7; color:#92400e; }

  .propuesta-card { background:#f0f4f8; border-radius:8px; padding:12px; margin-bottom:8px; }

  .fila-aprobacion, .fila-entregable { display:flex; justify-content:space-between; align-items:center; border:1px solid var(--gris-borde); border-radius:10px; padding: 12px 16px; margin-bottom:10px; }
  .estado-pill { font-size:11px; padding: 3px 10px; border-radius: 10px; background:#eef2ff; color:#3730a3; font-weight:700; }

  /* Selector de clientes (pestaña Consultoría) */
  .cliente-activo-bar {
    display:flex; justify-content:space-between; align-items:center;
    background: #f0f4ff; border: 1px solid #dbe4fb; border-radius: 10px;
    padding: 10px 16px; margin-bottom: 18px; font-size: 13.5px;
  }

  /* Buscador de clientes: input + dropdown de sugerencias filtradas */
  .buscador-cliente-wrap { position: relative; margin-top: 14px; }
  .buscador-cliente { font-size: 15px; padding: 13px 16px; border-radius: 10px; }
  .sugerencias-cliente {
    position: absolute; top: calc(100% + 6px); left:0; right:0; z-index: 20;
    background:#fff; border:1px solid var(--gris-borde); border-radius: 10px;
    box-shadow: 0 10px 26px rgba(30,58,138,.14); max-height: 280px; overflow-y:auto;
  }
  .sugerencia-item { display:flex; justify-content:space-between; align-items:center; gap:10px; padding: 11px 15px; cursor:pointer; font-size: 13.5px; border-bottom: 1px solid #f0f2f6; }
  .sugerencia-item:last-child { border-bottom:none; }
  .sugerencia-item:hover { background: #f5f9ff; }
  .sugerencia-item strong { color: var(--texto); }
  .sugerencia-item span { color: var(--texto-suave); font-size: 12px; }
  .sugerencia-vacia { padding: 13px 15px; font-size: 13px; color: var(--texto-suave); }
  .cliente-preview-card { margin-top: 18px; background: #f7f9fe; border-color: #dbe4fb; }

  .tabla-historial { width:100%; border-collapse: collapse; margin-top: 16px; }
  .tabla-historial th, .tabla-historial td { text-align:left; padding: 8px 10px; border-bottom: 1px solid var(--gris-borde); font-size: 13px; }
  .tabla-historial th { color: var(--texto-suave); font-size: 11px; text-transform: uppercase; }

  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--texto); color:#fff; padding: 12px 18px; border-radius: 10px; font-size: 13px; max-width: 380px; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
  .toast.error { background: var(--rojo); }
  .toast.exito { background: var(--verde); }

  .overlay { position: fixed; inset:0; background: rgba(255,255,255,.85); display:flex; flex-direction:column; align-items:center; justify-content:center; gap: 14px; z-index: 50; }
  .spinner { width:38px; height:38px; border:4px solid var(--gris-borde); border-top-color: var(--azul-claro); border-radius:50%; animation: girar 0.8s linear infinite; }
  @keyframes girar { to { transform: rotate(360deg); } }

  .alerta-error { background:#fef2f2; border:1px solid #fecaca; color:#991b1b; padding:10px 14px; border-radius:8px; margin-top:12px; font-size:13px; }
</style>
