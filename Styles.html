<style>
  /* =====================================================================
     Célula Talento y Cultura — sistema visual
     El azul de siempre + el amarillo característico de Buk. Tipografía del
     sistema (sin fuentes externas, sin cursivas). TODAS las clases usadas
     por UI.html / JsClient.html se conservan.
     ===================================================================== */
  :root {
    --font: 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;

    --ink: #241d19; --ink-soft: #6b6058; --ink-faint: #a89e95;
    --bg: #e9f0fb; --surface: #ffffff; --border: #dbe6f8; --border-fuerte: #c3d5f3;

    --azul: #1e3a8a; --azul-oscuro: #142c6e; --azul-suave: #e8edfb; --azul-suave2: #f4f7fd;
    --navy: var(--azul); --navy-soft: var(--azul-suave); --azul-claro: var(--azul);

    --amarillo: #ffc72c; --amarillo-oscuro: #d99e00; --amarillo-suave: #fff6dc;

    --verde: #1a9e5c; --verde-soft: #e7f8ee;
    --rojo: #e0403a; --rojo-soft: #fdeceb;
    --naranja: #d98c1a; --naranja-soft: #fdf2e1;

    /* Biblioteca de Simuladores T&C: antes en violeta, ahora en azul/dorado "muy Buk" a pedido de la usuaria. */
    --magia-violeta: var(--amarillo-oscuro); --magia-oro: var(--amarillo-oscuro); --magia-bg: var(--azul-suave2); --magia-borde: var(--border-fuerte);

    --gradiente: linear-gradient(135deg, #2d4fc7, #1e3a8a 60%, #142c6e);
    --gradiente-navy: linear-gradient(135deg, #33427a, #1e2a4a 70%);
    --gradiente-amarillo: linear-gradient(135deg, #ffd85e, #ffc72c 60%, #f0b400);
    --gradiente-magia: var(--gradiente);

    --radius-sm: 10px; --radius-md: 16px; --radius-lg: 22px; --radius-pill: 999px;
    --sombra-sm: 0 1px 3px rgba(36,29,25,.06);
    --sombra-md: 0 10px 28px rgba(36,29,25,.09);
    --sombra-lg: 0 22px 54px rgba(36,29,25,.16);

    /* alias retro-compatibles: por si algún estilo viejo referenciaba estos nombres */
    --gris-fondo: var(--bg); --gris-borde: var(--border);
    --texto: var(--ink); --texto-suave: var(--ink-soft);
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--font);
    background: linear-gradient(180deg, #f6f9fd 0%, #e9f0fb 50%, #dfe9f8 100%);
    background-attachment: fixed;
    color: var(--ink); margin: 0;
    -webkit-font-smoothing: antialiased;
  }
  #app { max-width: 1040px; margin: 0 auto; padding: 0 18px 70px; }

  ::selection { background: var(--azul-suave); color: var(--azul-oscuro); }

  /* ------------------------------ Encabezado ------------------------------ */
  .app-header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 28px 6px 18px; gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; flex-direction: column; gap: 2px; }
  .brand-marca {
    display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase;
    color: var(--azul);
  }
  .brand-titulo {
    display: block; font-size: 25px; font-weight: 800; color: var(--navy); letter-spacing: -0.4px; margin-top: 1px;
  }
  .brand-tagline {
    display: block; margin-top: 4px; font-size: 12.5px; font-weight: 500; color: var(--ink-faint);
  }
  /* clase antigua conservada por compatibilidad — ya no se usa en el markup actual */
  .brand-subtitulo { display: block; font-size: 12px; font-weight: 500; color: var(--ink-faint); margin-top: 2px; }

  .header-acciones { display: flex; align-items: center; gap: 10px; }
  .btn-home { background: none; border: none; cursor: pointer; font-size: 18px; line-height: 1; padding: 8px; border-radius: var(--radius-sm); transition: background .15s ease, transform .15s ease; }
  .btn-home:hover { background: var(--azul-suave2); transform: translateY(-1px); }
  .btn-link { background: none; border: none; color: var(--azul-claro); cursor: pointer; font-size: 13.5px; text-decoration: underline; padding: 4px; font-family: inherit; }
  .btn-link:hover { color: var(--azul-oscuro); }

  /* Biblioteca de Simuladores — mismo estilo "solo emoticono" que el ícono de inicio (sin círculo de fondo). */
  .btn-hat {
    position: relative; background: none; border: none; cursor: pointer;
    font-size: 19px; line-height: 1; padding: 8px; border-radius: var(--radius-sm);
    transition: background .15s ease, transform .15s ease;
  }
  .btn-hat:hover { background: var(--azul-suave2); transform: translateY(-1px); }
  .btn-hat:active { transform: translateY(0) scale(.96); }
  .btn-hat .sparkle { position: absolute; top: 2px; right: 2px; font-size: 10px; animation: destellar 2.4s ease-in-out infinite; }
  @keyframes destellar { 0%, 100% { opacity: .4; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.15); } }
  .btn-hat-tooltip {
    position: absolute; top: 40px; right: 0; z-index: 40; width: auto; white-space: nowrap;
    background: var(--ink); color: #fff; font-size: 11px; line-height: 1.4; font-weight: 600;
    padding: 6px 11px; border-radius: 8px; box-shadow: var(--sombra-md);
    opacity: 0; pointer-events: none; transform: translateY(-4px); transition: all .18s ease;
  }
  .header-acciones:hover .btn-hat-tooltip { opacity: 1; transform: translateY(0); }

  /* ------------------------------ Pestañas principales ------------------------------ */
  .tabs-principales { display: flex; gap: 6px; padding: 5px; margin: 0 6px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--sombra-sm); }
  .tab-principal {
    flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    background: transparent; color: var(--ink-soft); border: none; border-radius: var(--radius-md);
    padding: 13px 14px; font-size: 14px; font-weight: 700; font-family: inherit; transition: all .18s ease;
  }
  .tab-principal .tab-icono { font-size: 16px; }
  .tab-principal:hover { color: var(--azul-oscuro); background: var(--azul-suave2); }
  .tab-principal.activo { background: var(--gradiente); color: #fff; box-shadow: 0 6px 16px rgba(30,58,138,.35); }

  .wizard-nav { display: flex; gap: 4px; overflow-x: auto; padding: 0 0 18px; }
  .wizard-nav .paso { flex: 0 0 auto; font-size: 11px; padding: 7px 12px; border-radius: var(--radius-pill); background: var(--surface); border: 1px solid var(--border); color: var(--ink-soft); font-weight: 700; }
  .wizard-nav .paso.activo { background: var(--navy); color: #fff; border-color: var(--navy); }
  .wizard-nav .paso.completado { background: var(--verde-soft); border-color: var(--verde); color: var(--verde); }

  .wizard-body { background: var(--surface); border-radius: var(--radius-lg); padding: 32px 34px; box-shadow: var(--sombra-md); border: 1px solid var(--border); }
  .vista-principal { animation: aparecer .25s ease; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  /* ------------------------- Pantalla de inicio (landing) ------------------------- */
  .vista-landing { position: relative; overflow: hidden; padding: 20px 4px 8px; }
  .landing-blob {
    position: absolute; border-radius: 50%; filter: blur(54px); opacity: .4; z-index: 0; pointer-events: none;
    animation: flotar 9s ease-in-out infinite;
  }
  .landing-blob-1 { width: 280px; height: 280px; background: radial-gradient(circle, #ffe17a, transparent 70%); top: -100px; left: -70px; }
  .landing-blob-2 { width: 240px; height: 240px; background: radial-gradient(circle, #a9b8f5, transparent 70%); bottom: -90px; right: -50px; animation-delay: -4.5s; }
  @keyframes flotar { 0%, 100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-14px) scale(1.06); } }

  .landing-hero { position: relative; z-index: 1; text-align: center; max-width: 660px; margin: 6px auto 30px; }
  .landing-eyebrow {
    display: inline-block; font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase;
    background: var(--amarillo-suave); color: var(--azul); padding: 6px 15px; border-radius: var(--radius-pill); margin-bottom: 16px;
  }
  .landing-hero h1 { font-size: 29px; font-weight: 800; color: var(--navy); margin: 0; line-height: 1.32; letter-spacing: -.4px; }

  /* Journey / stepper del proceso */
  .journey { position: relative; z-index: 1; display: flex; align-items: flex-start; justify-content: center; gap: 0; max-width: 780px; margin: 0 auto 38px; padding: 0 6px; }
  .journey-paso { flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 0 4px; }
  .journey-linea { position: absolute; top: 21px; left: -50%; width: 100%; height: 3px; background: var(--azul); opacity: .35; z-index: 0; }
  .journey-paso:first-child .journey-linea { display: none; }
  /* Línea de tiempo informativa: los 4 pasos tienen siempre la misma presencia
     visual (azul sólido) — el amarillo se reserva para señalar en qué paso
     está el cliente, sin apagar ni "deshabilitar" el resto. */
  .journey-nodo {
    position: relative; z-index: 1; width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 17px; background: var(--azul); border: none; color: #fff; font-weight: 800; margin-bottom: 10px;
    box-shadow: var(--sombra-sm); transition: all .2s ease;
  }
  .journey-paso.actual .journey-nodo { box-shadow: 0 0 0 4px var(--amarillo-suave), 0 0 0 6px var(--amarillo); }
  .journey-titulo { font-size: 12.5px; font-weight: 800; color: var(--ink); line-height: 1.3; max-width: 130px; }
  .journey-responsable { font-size: 10px; font-weight: 700; color: var(--azul); text-transform: uppercase; letter-spacing: .3px; margin-top: 3px; }
  .journey-estado { display: none; }
  .journey.compacto { max-width: 100%; margin: 0 0 22px; gap: 0; }
  .journey.compacto .journey-titulo { font-size: 11px; max-width: 100px; }
  .journey.compacto .journey-nodo { width: 34px; height: 34px; font-size: 14px; margin-bottom: 6px; }
  .journey.compacto .journey-linea { top: 17px; }
  .journey.compacto .journey-responsable { display: none; }

  .landing-cards { position: relative; z-index: 1; display: flex; gap: 18px; flex-wrap: wrap; justify-content: center; }
  .landing-card {
    flex: 1 1 230px; max-width: 280px; display: flex; flex-direction: column; align-items: flex-start; text-align: left;
    gap: 6px; background: var(--surface); border: 1.5px solid var(--border); border-radius: var(--radius-lg); padding: 26px 22px;
    cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease; font-family: inherit;
  }
  .landing-card:hover { transform: translateY(-6px); box-shadow: var(--sombra-lg); border-color: transparent; }
  .landing-card-icono {
    width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; font-size: 23px;
    border-radius: 14px; background: var(--gradiente); margin-bottom: 4px;
    box-shadow: 0 8px 18px rgba(30,58,138,.3); transition: transform .2s ease;
  }
  .landing-card.kickoff .landing-card-icono { background: var(--gradiente-navy); box-shadow: 0 8px 18px rgba(30,42,74,.3); }
  .landing-card:hover .landing-card-icono { transform: scale(1.08) rotate(-4deg); }
  .landing-card-titulo { font-size: 16px; font-weight: 800; color: var(--ink); }
  .landing-card-desc { font-size: 12.5px; color: var(--ink-soft); line-height: 1.5; }
  .landing-card-cta { margin-top: 8px; font-size: 12.5px; font-weight: 700; color: var(--azul-oscuro); }

  .step h2 { color: var(--navy); margin-top: 0; font-size: 20px; font-weight: 800; }
  .hint { color: var(--ink-soft); font-size: 13.5px; margin-top: -6px; }
  .hidden { display: none !important; }

  label { display: block; margin-bottom: 14px; font-size: 12.5px; font-weight: 700; color: var(--ink-soft); }
  input, select, textarea {
    width: 100%; margin-top: 6px; padding: 11px 12px; border: 1.5px solid var(--border); background: var(--surface);
    border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; color: var(--ink); transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--azul); box-shadow: 0 0 0 4px var(--azul-suave); }
  textarea { resize: vertical; }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 20px; }

  .separador-seccion { border: none; border-top: 1.5px solid var(--border); margin: 34px 0 24px; }

  .step-actions { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
  button { cursor: pointer; border: none; border-radius: var(--radius-sm); padding: 12px 20px; font-size: 14px; font-weight: 700; font-family: inherit; transition: transform .08s ease, box-shadow .15s ease, background .15s ease; }
  button:active { transform: scale(0.98); }
  .btn-primary { background: var(--azul); color: #fff; }
  .btn-primary:hover { background: var(--azul-oscuro); }
  .btn-secondary { background: var(--surface); color: var(--ink-soft); border: 1.5px solid var(--border); }
  .btn-secondary:hover { border-color: var(--azul); color: var(--azul-oscuro); }
  .btn-generar { background: var(--gradiente-amarillo); color: var(--azul); padding: 16px 28px; font-size: 15px; box-shadow: 0 8px 20px rgba(224,168,0,.35); }
  .btn-generar:hover { box-shadow: 0 10px 24px rgba(224,168,0,.45); }
  .btn-generar:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: none; }
  .btn-magia { background: var(--gradiente-magia); color: #fff; box-shadow: 0 8px 20px rgba(30,58,138,.32); }
  .btn-magia:hover { box-shadow: 0 10px 24px rgba(30,58,138,.42); }

  .modulos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .modulo-card { border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 13px 15px; display: flex; align-items: flex-start; gap: 10px; cursor: pointer; transition: all .15s; }
  .modulo-card:hover { border-color: #c9d6f7; background: var(--azul-suave2); }
  .modulo-card.seleccionado { border-color: var(--azul); background: var(--azul-suave); }
  .modulo-card input { width: auto; margin: 3px 0 0; }
  .modulo-card .titulo { font-weight: 700; }
  .modulo-card .desc { font-size: 12px; color: var(--ink-soft); font-weight: 400; }

  .modulo-en-curso { font-size: 13px; color: var(--azul-oscuro); font-weight: 800; text-transform: uppercase; margin-bottom: 10px; letter-spacing: .3px; }
  .pregunta-actual .texto-pregunta { font-size: 17px; font-weight: 800; margin-bottom: 4px; color: var(--ink); }
  .pregunta-actual .ayuda { font-size: 13px; color: var(--ink-soft); margin-bottom: 14px; }
  .opciones-pregunta { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .opcion-btn { text-align: left; background: var(--surface); border: 1.5px solid var(--border); padding: 13px 15px; border-radius: var(--radius-sm); font-weight: 600; transition: all .12s; }
  .opcion-btn:hover { border-color: var(--azul); background: var(--azul-suave2); transform: translateX(2px); }
  .opcion-btn.marcada { border-color: var(--azul); background: var(--azul-suave); }
  .barra-progreso { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 20px; overflow: hidden; }
  .barra-progreso-fill { height: 100%; background: var(--gradiente); transition: width .3s; }

  .tarjeta-resumen { border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px; margin-bottom: 14px; background: var(--surface); }
  .tarjeta-resumen h3 { margin: 0 0 8px; color: var(--navy); font-size: 16px; font-weight: 800; }
  .tarjeta-resumen.contexto-general { background: var(--azul-suave2); border-color: var(--azul-suave); }
  .contexto-general dl { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 22px; margin: 8px 0 0; }
  .contexto-general dt { font-size: 11px; font-weight: 800; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .3px; }
  .contexto-general dd { margin: 2px 0 0; font-size: 13.5px; }
  .badge-madurez { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: var(--radius-pill); color: #fff; margin-left: 8px; font-weight: 700; }
  .badge-baja { background: var(--rojo); } .badge-media { background: var(--naranja); } .badge-alta { background: var(--verde); }
  .badge-sin-determinar { background: #9aa5b1; }
  .etiquetas { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .etiqueta { background: var(--navy-soft); color: var(--navy); font-size: 12px; padding: 3px 10px; border-radius: var(--radius-pill); font-weight: 600; }

  .respuestas-detalle { margin-top: 12px; }
  .respuestas-detalle summary { cursor: pointer; font-size: 12.5px; color: var(--azul-oscuro); font-weight: 700; }
  .respuesta-item { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .respuesta-item strong { color: var(--ink); font-weight: 600; }
  .respuesta-item span { color: var(--ink-soft); text-align: right; }

  .tabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab-btn { background: var(--surface); border: 1.5px solid var(--border); padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 700; font-family: inherit; }
  .tab-btn.activo { background: var(--navy); color: #fff; border-color: var(--navy); }

  .bloque-revision { margin-bottom: 18px; }
  .bloque-revision h4 { margin-bottom: 4px; color: var(--navy); font-size: 14px; font-weight: 800; }
  .bloque-revision textarea { min-height: 70px; }
  .bloque-revision textarea.textarea-grande { min-height: 170px; }
  .fila-origen { font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .origen-tag { padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; margin-right: 4px; }
  .origen-CLIENTE { background: var(--verde-soft); color: #166534; }
  .origen-BASE_CONOCIMIENTO { background: var(--navy-soft); color: #1e40af; }
  .origen-INFERENCIA_IA { background: var(--naranja-soft); color: #92400e; }

  .trazabilidad-detalle summary {
    cursor: pointer; color: var(--navy); font-size: 14px; font-weight: 800; list-style: none;
    display: flex; align-items: center; gap: 6px; margin-bottom: 4px;
  }
  .trazabilidad-detalle summary::-webkit-details-marker { display: none; }
  .trazabilidad-detalle summary::before { content: '▸'; font-size: 11px; color: var(--ink-soft); transition: transform .15s ease; }
  .trazabilidad-detalle[open] summary::before { transform: rotate(90deg); }

  .propuesta-card { background: var(--navy-soft); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }

  .fila-aprobacion, .fila-entregable { display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 10px; background: var(--surface); }
  .estado-pill { font-size: 11px; padding: 3px 10px; border-radius: var(--radius-pill); background: var(--navy-soft); color: var(--navy); font-weight: 700; }

  /* Selector de clientes (Kick Off / Consultoría) */
  .cliente-activo-bar {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--azul-suave2); border: 1px solid var(--azul-suave); border-radius: var(--radius-md);
    padding: 11px 16px; margin-bottom: 18px; font-size: 13.5px;
  }

  .asistente-experto-card {
    display: flex; justify-content: space-between; align-items: center; gap: 14px;
    background: var(--azul-suave2); border: 1px solid var(--azul-suave); border-radius: var(--radius-md);
    padding: 13px 18px; margin-bottom: 18px;
  }
  .asistente-experto-card strong { color: var(--navy); font-size: 14px; }
  .asistente-experto-card p { margin: 2px 0 0; }
  .asistente-experto-card .btn-secondary { white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
  .asistente-experto-card .btn-generar { white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; }
  .asistente-experto-info { display: flex; align-items: center; gap: 14px; }
  .asistente-experto-icono {
    flex: none; width: 42px; height: 42px; border-radius: 50%; background: var(--gradiente-amarillo);
    display: flex; align-items: center; justify-content: center; font-size: 20px;
    box-shadow: 0 6px 14px rgba(224,168,0,.35); animation: pulso-suave 2.4s ease-in-out infinite;
  }
  @keyframes pulso-suave { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }

  .buscador-cliente-wrap { position: relative; margin-top: 14px; }
  .buscador-cliente { font-size: 15px; padding: 14px 16px; border-radius: var(--radius-md); }
  .sugerencias-cliente {
    position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 20;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md);
    box-shadow: var(--sombra-lg); max-height: 280px; overflow-y: auto;
  }
  .sugerencia-item { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 15px; cursor: pointer; font-size: 13.5px; border-bottom: 1px solid var(--bg); }
  .sugerencia-item:last-child { border-bottom: none; }
  .sugerencia-item:hover { background: var(--azul-suave2); }
  .sugerencia-item strong { color: var(--ink); }
  .sugerencia-item span { color: var(--ink-soft); font-size: 12px; }
  .sugerencia-vacia { padding: 13px 15px; font-size: 13px; color: var(--ink-soft); }
  .cliente-preview-card { margin-top: 18px; background: var(--azul-suave2); border-color: var(--azul-suave); }

  /* --------------------------------- Kick Off COE --------------------------------- */
