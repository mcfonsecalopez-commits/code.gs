// ------------------------- Toggles Sí/No (Paso 1 y Paso 3) -------------------------
// Componente liviano reutilizable: cada contenedor .toggle-si-no trae su propio
// data-campo, y el valor elegido se guarda en st.toggles[campo] (no en el DOM),
// para que sobreviva si el usuario navega entre pasos con "← Atrás".

function inicializarTogglesSiNo() {
  document.querySelectorAll('.toggle-si-no').forEach(function (cont) {
    const campo = cont.dataset.campo;
    cont.innerHTML = ['Sí', 'No'].map(function (v) {
      return '<button type="button" class="toggle-opt" onclick="setToggleSiNo(\'' + campo + '\',\'' + v + '\')">' + v + '</button>';
    }).join('');
  });
}

function setToggleSiNo(campo, valor) {
  st.toggles = st.toggles || {};
  st.toggles[campo] = valor;
  const cont = document.querySelector('.toggle-si-no[data-campo="' + campo + '"]');
  if (cont) {
    Array.prototype.forEach.call(cont.querySelectorAll('.toggle-opt'), function (btn) {
      btn.classList.toggle('activo', btn.textContent === valor);
    });
  }
  if (campo === 'f_otra_plataforma') {
    document.getElementById('wrap_otra_plataforma_cual').classList.toggle('hidden', valor !== 'Sí');
  }
}

function valorToggle(campo) { return (st.toggles && st.toggles[campo]) || ''; }

// --------------------------- Infraestructura de llamadas ---------------------------

function llamarServidor(nombreFuncion) {
  const args = Array.prototype.slice.call(arguments, 1);
  mostrarCarga(true);
  return new Promise(function (resolve, reject) {
    google.script.run
      .withSuccessHandler(function (respuesta) {
        mostrarCarga(false);
        if (respuesta && respuesta.success === false) {
          mostrarToast(respuesta.mensaje || 'Ocurrió un error.', 'error');
          reject(respuesta);
        } else {
          resolve(respuesta ? respuesta.data : undefined);
        }
      })
      .withFailureHandler(function (error) {
        mostrarCarga(false);
        mostrarToast('Error de comunicación con el servidor: ' + error.message, 'error');
        reject(error);
      })
      [nombreFuncion].apply(null, args);
  });
}

function mostrarCarga(visible) { document.getElementById('overlayCarga').classList.toggle('hidden', !visible); }

function mostrarToast(mensaje, tipo) {
  const t = document.getElementById('toast');
  t.textContent = mensaje;
  t.className = 'toast' + (tipo ? ' ' + tipo : '');
  t.classList.remove('hidden');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(function () { t.classList.add('hidden'); }, 5000);
}

function mostrarErrorFatal(e) {
  console.error(e);
  mostrarToast('No se pudo cargar la información inicial. Recarga la página.', 'error');
}

/**
 * Handler de .catch() para TODAS las llamadas al servidor. Cualquier error,
 * esperado o no, se ve en pantalla y en la consola (F12) para poder
 * diagnosticarlo — nunca se traga en silencio.
 */
function manejarErrorInesperado_(e) {
  if (e && typeof e === 'object' && e.success === false) {
    console.error('Error de servidor (ya mostrado al usuario):', e);
    return;
  }
  console.error('Error inesperado en la interfaz:', e);
  mostrarToast('Ocurrió un error inesperado en la interfaz: ' + (e && e.message ? e.message : e) + ' (más detalle en la consola, F12).', 'error');
}

  document.getElementById('tabBtn-kickoff').classList.toggle('activo', nombre === 'kickoff');

  if (nombre === 'historial') cargarHistorial();
}

/**
 * Dibuja el stepper visual Diagnóstico -> Kick Off COE -> Consultoría -> Crear lugares
 * de trabajo más felices, con el responsable de cada etapa debajo del nombre.
 * `estado` es un objeto { diagnostico: 'hecho'|'actual'|'futuro', kickoff: ..., consultoria: ..., implementacion: ... }.
 * Si se omite una etapa, se calcula un estado por defecto según cuántas etapas anteriores están "hecho".
 */
function renderJourney(contenedorId, estado) {
  const cont = document.getElementById(contenedorId);
  if (!cont) return;
  estado = estado || {};
  let huboActual = false;
  const estadosFinales = JOURNEY_ETAPAS.map(function (e) {
    let s = estado[e.id];
    if (!s) { s = huboActual ? 'futuro' : 'actual'; }
    if (s === 'actual') huboActual = true;
    return s;
  });

  const textos = {
    diagnostico: { hecho: 'Completado', actual: 'En curso', futuro: 'Aún no empieza' },
    kickoff: { hecho: 'Registrado', actual: 'Pendiente de registrar', futuro: 'Después del diagnóstico' },
    consultoria: { hecho: 'Generada', actual: 'Lista para generar', futuro: 'Después del Kick Off' },
    implementacion: { hecho: '', actual: '', futuro: '' }
  };

  cont.innerHTML = JOURNEY_ETAPAS.map(function (e, i) {
    const s = estadosFinales[i];
    const nodo = s === 'hecho' ? '✓' : e.icono;
    return '<div class="journey-paso ' + s + '"><div class="journey-linea"></div>' +
      '<div class="journey-nodo">' + nodo + '</div>' +
      '<div class="journey-titulo">' + e.titulo + '</div>' +
      (e.responsable ? '<div class="journey-responsable">' + e.responsable + '</div>' : '') +
      '<div class="journey-estado">' + (textos[e.id][s] || '') + '</div></div>';
  }).join('');
}

/** Calcula el estado del journey para un cliente puntual, a partir de lo que ya se sabe de él en `st`/`stKickoff`. */
function estadoJourneyParaCliente_(diagnosticado, tieneKickoff, consultorias) {
  const estado = {};
  estado.diagnostico = diagnosticado ? 'hecho' : 'actual';
  if (!diagnosticado) { estado.kickoff = 'futuro'; estado.consultoria = 'futuro'; estado.implementacion = 'futuro'; return estado; }
  estado.kickoff = tieneKickoff ? 'hecho' : 'actual';
  const hayConsultorias = consultorias && consultorias.length > 0;
  const todasEntregadas = hayConsultorias && consultorias.every(function (c) { return c.estado === 'Entregada'; });
  estado.consultoria = todasEntregadas ? 'hecho' : (hayConsultorias ? 'actual' : (tieneKickoff ? 'actual' : 'futuro'));
  estado.implementacion = todasEntregadas ? 'actual' : 'futuro';
  return estado;
}

function toggleModulo(nombreModulo, id) {

function guardarClienteYContinuar() {

    }

// -------------------------- Paso 4: Preguntas condicionales -----------------------

function iniciarDiagnosticoModuloActual() {
  if (st.indiceModuloActual >= st.colaModulos.length) { irAPaso(5); return; }
  const modulo = st.colaModulos[st.indiceModuloActual];
  document.getElementById('moduloEnCurso').textContent =
    'Módulo ' + (st.indiceModuloActual + 1) + ' de ' + st.colaModulos.length + ': ' + modulo;

  if (st.arbolPorModulo[modulo]) { renderPreguntaActual(modulo); return; }

  llamarServidor('apiGetArbolPreguntas', modulo).then(function (arbol) {
    st.arbolPorModulo[modulo] = arbol;
    st.respuestasPorModulo[modulo] = {};
    st.historialPreguntas[modulo] = [];
    if (!arbol || arbol.length === 0) {
      mostrarToast('El módulo "' + modulo + '" aún no tiene preguntas configuradas en la Base de Conocimiento. Se omite del diagnóstico.', 'error');
      pasarSiguienteModulo();
      return;
    }
    renderPreguntaActual(modulo);
  }).catch(manejarErrorInesperado_);
}

function esVisible_(pregunta, respuestas) {
  if (!pregunta.preguntaPadreId) return true;
  const respuestaPadre = respuestas[pregunta.preguntaPadreId];
  if (respuestaPadre === undefined) return false;
  const valores = Array.isArray(respuestaPadre) ? respuestaPadre : [respuestaPadre];
  return valores.indexOf(pregunta.valorPadreDispara) !== -1;
}

function siguientePreguntaPendiente_(modulo) {
  const arbol = st.arbolPorModulo[modulo];
  const respuestas = st.respuestasPorModulo[modulo];
  return arbol.find(function (p) { return esVisible_(p, respuestas) && respuestas[p.id] === undefined; }) || null;
}

function renderPreguntaActual(modulo) {
  const pregunta = siguientePreguntaPendiente_(modulo);
  const cont = document.getElementById('preguntaActual');

  const arbol = st.arbolPorModulo[modulo];
  const visibles = arbol.filter(function (p) { return esVisible_(p, st.respuestasPorModulo[modulo]); });
  const respondidas = visibles.filter(function (p) { return st.respuestasPorModulo[modulo][p.id] !== undefined; });
  const progreso = visibles.length ? Math.round(100 * respondidas.length / visibles.length) : 0;

  if (!pregunta) {
    // Terminó este módulo: calcular diagnóstico estructurado y pasar al siguiente
    llamarServidor('apiProcesarDiagnostico', st.clienteId, modulo, st.respuestasPorModulo[modulo])
      .then(function (registro) {
        st.diagnosticosPorModulo.push({ modulo: modulo, diagnosticoId: registro.id, diagnosticoJson: registro.diagnostico_json });
        pasarSiguienteModulo();
      }).catch(manejarErrorInesperado_);
    return;
  }

  st.historialPreguntas[modulo].push(pregunta.id);

  let html = '<div class="barra-progreso"><div class="barra-progreso-fill" style="width:' + progreso + '%"></div></div>';
  html += '<div class="texto-pregunta">' + escapar(pregunta.pregunta) + '</div>';
  if (pregunta.ayuda) html += '<div class="ayuda">' + escapar(pregunta.ayuda) + '</div>';

  if (pregunta.tipo === 'checkbox') {
    html += '<div class="opciones-pregunta" id="opcionesCheckbox">' + pregunta.opciones.map(function (o) {
      return '<label class="opcion-btn"><input type="checkbox" value="' + escapar(o.valor) + '" style="width:auto;margin-right:8px;">' + escapar(o.valor) + '</label>';
    }).join('') + '</div><button class="btn-primary" onclick="responderCheckbox(\'' + modulo + '\',\'' + pregunta.id + '\')">Continuar</button>';
  } else if (pregunta.tipo === 'texto') {
    html += '<textarea id="respuestaTexto" rows="3"></textarea>' +
      '<button class="btn-primary" style="margin-top:10px" onclick="responderTexto(\'' + modulo + '\',\'' + pregunta.id + '\')">Continuar</button>';
  } else {
    // radio / select -> avanza automáticamente al elegir
    html += '<div class="opciones-pregunta">' + pregunta.opciones.map(function (o) {
      return '<button class="opcion-btn" onclick="responder(\'' + modulo + '\',\'' + pregunta.id + '\',\'' + escapar(o.valor).replace(/'/g, "\\'") + '\')">' + escapar(o.valor) + '</button>';
    }).join('') + '</div>';
  }
  cont.innerHTML = html;
}

function responder(modulo, preguntaId, valor) {
  st.respuestasPorModulo[modulo][preguntaId] = valor;
  renderPreguntaActual(modulo);
}
function responderCheckbox(modulo, preguntaId) {
  const seleccionadas = Array.prototype.slice.call(document.querySelectorAll('#opcionesCheckbox input:checked')).map(function (c) { return c.value; });
  if (seleccionadas.length === 0) { mostrarToast('Selecciona al menos una opción.', 'error'); return; }
  st.respuestasPorModulo[modulo][preguntaId] = seleccionadas;
  renderPreguntaActual(modulo);
}
function responderTexto(modulo, preguntaId) {
  const texto = document.getElementById('respuestaTexto').value.trim();
  if (!texto) { mostrarToast('Escribe una respuesta antes de continuar.', 'error'); return; }
  st.respuestasPorModulo[modulo][preguntaId] = texto;
  renderPreguntaActual(modulo);
}

function volverPreguntaAnterior() {
  const modulo = st.colaModulos[st.indiceModuloActual];
  if (!modulo) return;
  const hist = st.historialPreguntas[modulo];
  if (hist && hist.length > 0) {
    const ultimaId = hist.pop();
    delete st.respuestasPorModulo[modulo][ultimaId];
    renderPreguntaActual(modulo);
  } else if (st.indiceModuloActual > 0) {
    st.indiceModuloActual--;
    iniciarDiagnosticoModuloActual();
  } else {
    irAPaso(3);
  }
}

function pasarSiguienteModulo() {
  st.indiceModuloActual++;
  iniciarDiagnosticoModuloActual();
}

// --------------------------- Paso 5: Resumen del diagnóstico -----------------------

/**
 * Resumen enriquecido: además de las etiquetas por módulo (madurez,
 * necesidades, dolores, oportunidades), muestra el contexto general del
 * cliente (Pasos 1 y 3) y el detalle de las respuestas dadas pregunta por

 */
function renderResumenDiagnostico() {
  const cont = document.getElementById('resumenDiagnostico');
  const c = st.cliente;

  let html = '<div class="tarjeta-resumen contexto-general"><h3>Contexto general del cliente</h3><dl>' +
    '<div><dt>Account Manager</dt><dd>' + (escapar(c.accountManager) || '—') + '</dd></div>' +
    '<div><dt>URL / Sitio web</dt><dd>' + (escapar(c.url) || '—') + '</dd></div>' +
    '<div><dt>Cultura del cliente</dt><dd>' + (escapar(c.culturaFrase) || '—') + '</dd></div>' +
    '<div><dt>Objetivos y dolores</dt><dd>' + (escapar(c.objetivosYDolores) || '—') + '</dd></div>' +
    '<div><dt>Motivo de contratación de Buk</dt><dd>' + (escapar(c.motivoCompraBuk) || '—') + '</dd></div>' +
    '<div><dt>Estructura del equipo de implementación</dt><dd>' + (escapar(c.estructuraEquipo) || '—') + '</dd></div>' +
    '<div><dt>Información adicional</dt><dd>' + (escapar(c.infoAdicional) || '—') + '</dd></div>' +
    '<div><dt>Contexto comercial</dt><dd>' + (escapar(c.contextoComercial) || '—') + '</dd></div>' +
    '<div><dt>Procesos actuales</dt><dd>' + (escapar(c.procesosActuales) || '—') + '</dd></div>' +
    '<div><dt>Herramientas utilizadas</dt><dd>' + (escapar(c.herramientasUtilizadas) || '—') + '</dd></div>' +
    '<div><dt>Automatización percibida</dt><dd>' + (escapar(c.nivelAutomatizacion) || '—') + '</dd></div>' +
    '<div><dt>¿Usan herramientas ofimáticas?</dt><dd>' + (escapar(c.usaHerramientasOfimaticas) || '—') + '</dd></div>' +
    '</dl></div>';

  html += st.diagnosticosPorModulo.map(function (d) {
    const dj = d.diagnosticoJson;
    const claseMadurez = 'badge-' + (dj.madurez || 'sin-determinar').toLowerCase().replace(' ', '-');
    return '<div class="tarjeta-resumen">' +
      '<h3>' + escapar(d.modulo) + '<span class="badge-madurez ' + claseMadurez + '">Madurez: ' + escapar(dj.madurez || 'Sin determinar') + '</span></h3>' +
      '<div><strong>Necesidades:</strong><div class="etiquetas">' + etiquetasHtml(dj.principales_necesidades) + '</div></div>' +
      '<div style="margin-top:8px"><strong>Dolores:</strong><div class="etiquetas">' + etiquetasHtml(dj.dolores) + '</div></div>' +
      '<div style="margin-top:8px"><strong>Oportunidades (semilla):</strong><div class="etiquetas">' + etiquetasHtml(dj.oportunidades) + '</div></div>' +
      '<details class="respuestas-detalle"><summary>Ver respuestas del diagnóstico (' + Object.keys(dj.respuestas_originales || {}).length + ')</summary>' +
      respuestasLegibles_(d.modulo, dj.respuestas_originales) + '</details>' +
      '</div>';
  }).join('') || '<p class="alerta-error">No hay diagnósticos completados.</p>';

  cont.innerHTML = html;
}

function respuestasLegibles_(modulo, respuestas) {
  if (!respuestas || Object.keys(respuestas).length === 0) return '<p class="hint">Sin respuestas registradas.</p>';
  const arbol = st.arbolPorModulo[modulo] || [];
  return Object.keys(respuestas).map(function (pid) {
    const pregunta = arbol.find(function (p) { return p.id === pid; });
    const texto = pregunta ? pregunta.pregunta : pid;
    const valorCrudo = respuestas[pid];
    const valor = Array.isArray(valorCrudo) ? valorCrudo.join(', ') : valorCrudo;
    return '<div class="respuesta-item"><strong>' + escapar(texto) + '</strong><span>' + escapar(valor) + '</span></div>';
  }).join('');
}

function etiquetasHtml(arr) { return (arr || []).map(function (e) { return '<span class="etiqueta">' + escapar(e) + '</span>'; }).join('') || '<span class="hint">—</span>'; }

function descargarDiagnosticoPDF() {

// Mismo patrón de buscador que la pestaña de Consultoría, pero con ids e
// instancia de estado propios (stKickoff) para no interferir con `st`.

function refrescarListaClientesKickoff() {
  listaClientesKickoffCache = [];

  document.getElementById('previewClienteKickoff').innerHTML = '';

  llamarServidor('apiGetClientesConResumen').then(function (clientes) {
    listaClientesKickoffCache = clientes || [];
  }).catch(manejarErrorInesperado_);
}

/**
 * Funciona como lista desplegable y buscador a la vez: al enfocar el campo vacío
 * muestra la lista completa de clientes (los que ya tienen módulos diagnosticados
 * en Diagnóstico Comercial aparecen primero), y al escribir la filtra por nombre.
 */
function filtrarClientesKickoff() {
  const q = document.getElementById('buscadorClienteKickoff').value.trim().toLowerCase();
  const cont = document.getElementById('sugerenciasClientesKickoff');

  if (!listaClientesKickoffCache.length) {
    cont.innerHTML = '<div class="sugerencia-vacia">Todavía no hay clientes cargados. Ve a "Diagnóstico Comercial" para registrar el primero.</div>';
    cont.classList.remove('hidden');
    return;
  }

  const base = q
    ? listaClientesKickoffCache.filter(function (c) { return (c.nombre || '').toLowerCase().indexOf(q) !== -1; })
    : listaClientesKickoffCache.slice();

  base.sort(function (a, b) {
    const da = (a.modulos_diagnosticados || []).length > 0 ? 1 : 0;
    const db = (b.modulos_diagnosticados || []).length > 0 ? 1 : 0;
    if (da !== db) return db - da;
    return (a.nombre || '').localeCompare(b.nombre || '');
  });

  const resultados = base.slice(0, 30);
  cont.innerHTML = resultados.length ? resultados.map(function (c) {
    const nDiag = (c.modulos_diagnosticados || []).length;
    const detalle = escapar(c.industria || '') + (nDiag > 0 ? ' · ' + nDiag + ' módulo(s) diagnosticado(s)' : ' · sin diagnóstico');
    return '<div class="sugerencia-item" onclick="elegirSugerenciaClienteKickoff(\'' + c.id + '\')"><strong>' + escapar(c.nombre) + '</strong><span>' + detalle + '</span></div>';
  }).join('') : '<div class="sugerencia-vacia">No se encontró ninguna empresa con ese nombre.</div>';
  cont.classList.remove('hidden');
}

function elegirSugerenciaClienteKickoff(clienteId) {
  const c = listaClientesKickoffCache.find(function (x) { return x.id === clienteId; });
  document.getElementById('sugerenciasClientesKickoff').classList.add('hidden');
  if (!c) return;
  document.getElementById('buscadorClienteKickoff').value = c.nombre;
  const diagnosticado = (c.modulos_diagnosticados || []).length > 0;
  document.getElementById('previewClienteKickoff').innerHTML =
    '<div class="tarjeta-resumen cliente-preview-card"><h3>' + escapar(c.nombre) + '</h3>' +
    '<p class="hint" style="margin-top:6px">' + (diagnosticado ? (c.modulos_diagnosticados.length + ' módulo(s) ya diagnosticado(s).') : 'Este cliente todavía no tiene módulos diagnosticados — puedes registrar el Kick Off igual, pero se recomienda completar primero el Diagnóstico Comercial.') + '</p>' +
    '<div class="step-actions" style="margin-top:14px"><button class="btn-primary" onclick="seleccionarClienteKickoff(\'' + c.id + '\')">Continuar →</button></div></div>';
  document.getElementById('previewClienteKickoff').classList.remove('hidden');
}

function seleccionarClienteKickoff(clienteId) {
  Promise.all([
    llamarServidor('apiObtenerCliente', clienteId),
    llamarServidor('apiObtenerDiagnosticosCliente', clienteId),
    llamarServidor('apiObtenerRadiografiaCliente', clienteId),
    llamarServidor('apiObtenerConsultoriasCliente', clienteId)
  ]).then(function (resultados) {
    const cliente = resultados[0], diagnosticos = resultados[1], radiografiaExistente = resultados[2], consultorias = resultados[3];
    stKickoff.clienteId = cliente.id;
    stKickoff.cliente = cliente;
    stKickoff.notasUrl = radiografiaExistente ? (radiografiaExistente.notas_gemini_url || '') : '';

    document.getElementById('selectorClienteKickoff').classList.add('hidden');
    document.getElementById('subwizardKickoff').classList.remove('hidden');
    document.getElementById('nombreClienteActivoKickoff').textContent = cliente.nombre;
    document.getElementById('panelRadiografia').classList.add('hidden');

    renderJourney('journeyKickoff', estadoJourneyParaCliente_((diagnosticos || []).length > 0, !!radiografiaExistente, consultorias));

    if (radiografiaExistente) {
      document.getElementById('rad_notas_texto').value = radiografiaExistente.notas_gemini || '';
      renderRadiografia_(radiografiaExistente.radiografia);
      document.getElementById('kickoffVacio').classList.add('hidden');
    } else {
      document.getElementById('rad_notas_texto').value = '';
      document.getElementById('resultadoRadiografia').innerHTML = '';
      document.getElementById('kickoffVacio').classList.remove('hidden');
    }
    onNotasRadiografiaCambiaron();
  }).catch(manejarErrorInesperado_);
}

function cambiarClienteKickoff() {
  document.getElementById('subwizardKickoff').classList.add('hidden');
  document.getElementById('selectorClienteKickoff').classList.remove('hidden');

}

  const lista = function (arr) { return '<ul>' + (arr || []).map(function (x) { return '<li>' + escapar(x) + '</li>'; }).join('') + '</ul>' || '<p class="hint">—</p>'; };
  const listaVacia = function (arr) { return (arr && arr.length) ? lista(arr) : '<p class="hint">Sin información.</p>'; };

  let html = '<div class="tarjeta-resumen">';
  html += '<div class="step-actions" style="margin:0 0 14px;justify-content:flex-end">' +
    '<button class="btn-secondary" onclick="descargarRadiografiaPDF()">📄 Descargar PDF</button>' +

    '<div id="resultadoRadiografiaPDF"></div>';

  if (r.alertas_inconsistencia && r.alertas_inconsistencia.length) {
    html += '<div class="radiografia-seccion"><h4>⚠️ Alertas de inconsistencia</h4>' +
      r.alertas_inconsistencia.map(function (a) { return '<div class="alerta-inconsistencia">⚠️ ' + escapar(a) + '</div>'; }).join('') + '</div>';
  }

  html += '<div class="radiografia-seccion"><h4>🏢 Contexto del cliente</h4><p>' + escapar(r.contexto_cliente || '—') + '</p></div>';
  html += '<div class="radiografia-seccion"><h4>🎯 Necesidades principales</h4>' + listaVacia(r.necesidades_principales) + '</div>';
  html += '<div class="radiografia-seccion"><h4>⚙️ Procesos actuales</h4>' + listaVacia(r.procesos_actuales) + '</div>';
  html += '<div class="radiografia-seccion"><h4>🚀 Objetivos de implementación</h4>' + listaVacia(r.objetivos_implementacion) + '</div>';
  html += '<div class="radiografia-seccion"><h4>🔎 Hallazgos del Kick Off</h4>' + listaVacia(r.hallazgos_kickoff) + '</div>';
  html += '<div class="radiografia-seccion"><h4>⚠️ Riesgos</h4>' + listaVacia(r.riesgos) + '</div>';
  html += '<div class="radiografia-seccion"><h4>📌 Definiciones tomadas</h4>' + listaVacia(r.definiciones_tomadas) + '</div>';
  html += '<div class="radiografia-seccion"><h4>📥 Pendientes</h4>' + listaVacia(r.pendientes) + '</div>';
  html += '<div class="radiografia-seccion"><h4>👥 Responsables</h4>' +
    ((r.responsables && r.responsables.length) ? lista(r.responsables.map(function (p) { return (p.nombre || '—') + (p.rol ? ' — ' + p.rol : ''); })) : '<p class="hint">Sin información.</p>') + '</div>';
  html += '<div class="radiografia-seccion"><h4>🧩 Configuraciones requeridas</h4>' + listaVacia(r.configuraciones_requeridas) + '</div>';

  if (r.por_modulo) {
    html += '<div class="radiografia-seccion"><h4>📦 Información por módulo</h4>';
    Object.keys(r.por_modulo).forEach(function (m) {
      const bloque = r.por_modulo[m];
      if (!bloque || (!bloque.hallazgos.length && !bloque.decisiones.length && !bloque.pendientes.length)) return;
      html += '<div class="radiografia-modulo-card"><h5>' + escapar(m) + '</h5>';
      if (bloque.hallazgos.length) html += '<strong class="hint">Hallazgos</strong>' + lista(bloque.hallazgos);
      if (bloque.decisiones.length) html += '<strong class="hint">Decisiones</strong>' + lista(bloque.decisiones);
      if (bloque.pendientes.length) html += '<strong class="hint">Pendientes</strong>' + lista(bloque.pendientes);
      html += '</div>';
    });
    html += '</div>';
  }

  html += '</div>';
  cont.innerHTML = html;
}

// Guía de referencia estática (PREGUNTAS_ORIENTADORAS, arriba) — no captura datos ni
// llama al servidor, solo se muestra/filtra en el navegador.

function abrirPreguntasOrientadoras() {

function renderPreguntasOrientadoras() {
  const q = (document.getElementById('orientadorasBuscar').value || '').trim().toLowerCase();
  const cont = document.getElementById('orientadorasLista');
  const coincide = function (texto) { return !q || String(texto).toLowerCase().indexOf(q) !== -1; };
  const preguntaCoincide = function (p) {
    return (typeof p === 'string') ? coincide(p) : (coincide(p.texto) || (p.sub || []).some(coincide));
  };
  const pintarPregunta = function (p) {
    if (typeof p === 'string') return '<li>' + escapar(p) + '</li>';
    let li = '<li>' + escapar(p.texto);
    if (p.sub && p.sub.length) li += '<ul>' + p.sub.map(function (s) { return '<li>' + escapar(s) + '</li>'; }).join('') + '</ul>';
    return li + '</li>';
  };

  let html = '<div class="orientadoras-aviso">💡 ' + escapar(PREGUNTAS_ORIENTADORAS.aviso) + '</div>';
  let algo = false;

  const alineacionFiltradas = PREGUNTAS_ORIENTADORAS.alineacion.preguntas.filter(coincide);
  if (alineacionFiltradas.length) {
    algo = true;
    html += '<div class="orientadoras-seccion"><h3>' + escapar(PREGUNTAS_ORIENTADORAS.alineacion.titulo) + '</h3><ul>' +
      alineacionFiltradas.map(function (p) { return '<li>' + escapar(p) + '</li>'; }).join('') + '</ul></div>';
  }

  const resumenFiltradas = PREGUNTAS_ORIENTADORAS.resumenEstrategico.preguntas.filter(coincide);
  if (resumenFiltradas.length) {
    algo = true;
    html += '<div class="orientadoras-seccion"><h3>' + escapar(PREGUNTAS_ORIENTADORAS.resumenEstrategico.titulo) + '</h3><ol>' +
      resumenFiltradas.map(function (p) { return '<li>' + escapar(p) + '</li>'; }).join('') + '</ol></div>';
  }

  const modulosHtml = PREGUNTAS_ORIENTADORAS.modulos.map(function (m) {
    const nombreCoincide = coincide(m.nombre);
    const preguntas = nombreCoincide ? m.preguntas : m.preguntas.filter(preguntaCoincide);
    if (!preguntas.length) return '';
    return '<details class="orientadoras-modulo"' + (q ? ' open' : '') + '><summary>' + escapar(m.nombre) + '</summary><ul>' +
      preguntas.map(pintarPregunta).join('') + '</ul></details>';
  }).filter(Boolean).join('');

  if (modulosHtml) {
    algo = true;
    html += '<div class="orientadoras-seccion"><h3>¡Check & Go! — Profundización por Módulo</h3></div>' + modulosHtml;
  }

  cont.innerHTML = algo ? html : (html + '<div class="orientadoras-vacio">No se encontró ninguna pregunta con ese término.</div>');
}

/**
 * Intenta "diligenciar de una vez" el script externo pasándole en la URL los
 * datos del cliente que esta app ya tiene cargados (sector, tamaño, ciudad,
 * su sitio web). Esto solo pre-llena el formulario del lado del script SI ese
 * script (código externo, fuera de esta app, uno por cada AppScript de la
 * Biblioteca) fue programado para leer esos parámetros con doGet(e) — no hay
 * forma de garantizarlo desde acá porque no es código de este proyecto. Por
 * eso, junto al botón también se muestran los mismos datos en texto plano,
 * para copiarlos a mano si el script no los toma automáticamente.
 */
function construirUrlHerramientaConDatos_(url, cliente) {
  if (!url || !cliente) return url;
  const params = [];
  const add = function (clave, valor) { if (valor) params.push(clave + '=' + encodeURIComponent(valor)); };
  add('cliente', cliente.nombre);
  add('sector', cliente.industria);
  add('tamano', cliente.tamano);
  add('ciudad', cliente.pais);
  add('url', cliente.url);
  if (!params.length) return url;
  return url + (url.indexOf('?') === -1 ? '?' : '&') + params.join('&');
}

/** Scripts recomendados para un módulo puntual — usado dentro de la revisión de consultoría (sección 6 del rediseño). */
function renderScriptsRecomendados_(modulo, cliente) {
  if (!herramientasCache) {
    llamarServidor('apiGetHerramientas').then(function (h) { herramientasCache = h || []; renderRevisionConsultoria(); }).catch(function () { herramientasCache = []; });
    return '<div class="scripts-recomendados"><h4>📎 Scripts recomendados</h4><p class="hint">Cargando catálogo…</p></div>';
  }
  const delModulo = herramientasCache.filter(function (h) { return h.modulo === modulo; });
  if (!delModulo.length) return '';

  const datosCliente = [
    cliente && cliente.industria ? 'Sector: ' + cliente.industria : '',
    cliente && cliente.tamano ? 'Tamaño: ' + cliente.tamano : '',
    cliente && cliente.pais ? 'Ciudad: ' + cliente.pais : '',
    cliente && cliente.url ? 'URL: ' + cliente.url : ''
  ].filter(Boolean).join(' · ');

  return '<div class="scripts-recomendados"><h4>📎 Scripts recomendados para ' + escapar(modulo) + '</h4>' +
    '<p class="hint">Detectados automáticamente porque el cliente tiene este módulo contratado. Si el script recibe estos datos, ya vienen precargados en el enlace; si no, cópialos de aquí.</p>' +
    (datosCliente ? '<p class="scripts-datos-cliente">' + escapar(datosCliente) + '</p>' : '') +
    '<div class="scripts-recomendados-lista">' + delModulo.map(function (h) {
      return h.estado === 'Disponible'
        ? '<a class="script-chip" href="' + construirUrlHerramientaConDatos_(h.url, cliente) + '" target="_blank">🔗 ' + escapar(h.nombre) + '</a>'
        : '<span class="script-chip pendiente">⏳ ' + escapar(h.nombre) + '</span>';
    }).join('') + '</div></div>';
}

// ================== PESTAÑA "CONSULTORÍA Y GESTIÓN DE ENTREGABLES" ==================

/** Clientes cargados en "Diagnóstico Comercial", cacheados para filtrar el buscador sin ir al servidor en cada tecla. */
function refrescarListaClientes() {
  listaClientesCache = [];
  document.getElementById('buscadorCliente').value = '';
  document.getElementById('sugerenciasClientes').classList.add('hidden');
  document.getElementById('sugerenciasClientes').innerHTML = '';
  document.getElementById('previewCliente').classList.add('hidden');
  document.getElementById('previewCliente').innerHTML = '';

  llamarServidor('apiGetClientesConResumen').then(function (clientes) {
    listaClientesCache = clientes || [];
  }).catch(manejarErrorInesperado_);
}

/** Se llama con cada tecla del buscador: filtra por nombre y muestra hasta 8 sugerencias en un dropdown. */
function filtrarClientes() {
  const q = document.getElementById('buscadorCliente').value.trim().toLowerCase();
  const cont = document.getElementById('sugerenciasClientes');

  if (!q) { cont.classList.add('hidden'); cont.innerHTML = ''; return; }
  if (!listaClientesCache.length) {
    cont.innerHTML = '<div class="sugerencia-vacia">Todavía no hay clientes cargados. Ve a la pestaña "Diagnóstico Comercial" para registrar el primero.</div>';
    cont.classList.remove('hidden');
    return;
  }

  const resultados = listaClientesCache.filter(function (c) {
    return (c.nombre || '').toLowerCase().indexOf(q) !== -1;
  }).slice(0, 8);

  if (!resultados.length) {
    cont.innerHTML = '<div class="sugerencia-vacia">No se encontró ninguna empresa con ese nombre.</div>';
  } else {
    cont.innerHTML = resultados.map(function (c) {
      return '<div class="sugerencia-item" onclick="elegirSugerenciaCliente(\'' + c.id + '\')">' +
        '<strong>' + escapar(c.nombre) + '</strong><span>' + escapar(c.industria || '') + '</span></div>';
    }).join('');
  }
  cont.classList.remove('hidden');
}

function elegirSugerenciaCliente(clienteId) {
  const c = listaClientesCache.find(function (x) { return x.id === clienteId; });
  document.getElementById('sugerenciasClientes').classList.add('hidden');
  if (!c) return;
  document.getElementById('buscadorCliente').value = c.nombre;
  renderPreviewCliente(c);
}

/** Tarjeta de vista previa (industria, tamaño, módulos, estado) antes de continuar con ese cliente. */
function renderPreviewCliente(c) {
  const modulosContratados = c.modulos_contratados || [];
  const badgesModulos = modulosContratados.map(function (m) {
    const diagnosticado = (c.modulos_diagnosticados || []).indexOf(m) !== -1;
    return '<span class="etiqueta" style="' + (diagnosticado ? '' : 'opacity:.5') + '">' + escapar(m) + '</span>';
  }).join(' ') || '<span class="hint">—</span>';
  const diagnosticados = (c.modulos_diagnosticados || []).length + ' / ' + modulosContratados.length;

  document.getElementById('previewCliente').innerHTML =
    '<div class="tarjeta-resumen cliente-preview-card">' +
    '<h3>' + escapar(c.nombre) + '</h3>' +
    '<dl class="contexto-general" style="margin:8px 0 0">' +
    '<div><dt>Ciudad</dt><dd>' + (escapar(c.pais) || '—') + '</dd></div>' +
    '<div><dt>URL / Sitio web</dt><dd>' + (escapar(c.url) || '—') + '</dd></div>' +
    '<div><dt>Industria</dt><dd>' + (escapar(c.industria) || '—') + '</dd></div>' +
    '<div><dt>Tamaño</dt><dd>' + (escapar(c.tamano) || '—') + '</dd></div>' +
    '<div><dt>Diagnosticados</dt><dd>' + diagnosticados + '</dd></div>' +
    '</dl>' +
    '<div style="margin-top:12px"><strong>Módulos contratados:</strong><div class="etiquetas">' + badgesModulos + '</div></div>' +
    '<div style="margin-top:10px">' + resumenEstadoConsultoria_(c.conteo_estados, c.cantidad_consultorias) + '</div>' +
    '<div class="step-actions" style="margin-top:16px">' +
    '<button class="btn-primary" onclick="seleccionarCliente(\'' + c.id + '\')">Continuar →</button></div>' +
    '</div>';
  document.getElementById('previewCliente').classList.remove('hidden');
}

function resumenEstadoConsultoria_(conteo, total) {
  if (!total) return '<span class="estado-pill">Sin consultoría</span>';
  return Object.keys(conteo || {}).map(function (k) {
    return '<span class="estado-pill">' + conteo[k] + ' ' + escapar(k) + '</span>';
  }).join(' ');
}

/** El COI elige un cliente ya cargado y retoma su consultoría (nueva o ya iniciada). */
function seleccionarCliente(clienteId) {
  Promise.all([
    llamarServidor('apiObtenerCliente', clienteId),
    llamarServidor('apiObtenerDiagnosticosCliente', clienteId),
    llamarServidor('apiObtenerConsultoriasCliente', clienteId),
    llamarServidor('apiObtenerKickOffCliente', clienteId)
  ]).then(function (resultados) {
    const cliente = resultados[0], diagnosticos = resultados[1], consultorias = resultados[2], kickOffExistente = resultados[3];
    if (!diagnosticos || diagnosticos.length === 0) {
      mostrarToast('Este cliente todavía no tiene ningún módulo diagnosticado. Complétalo en "Diagnóstico Comercial".', 'error');
      return;
    }

    st.cliente = cliente;
    st.clienteId = cliente.id;
    st.diagnosticosPorModulo = diagnosticos.map(function (d) {
      return { modulo: d.modulo, diagnosticoId: d.id, diagnosticoJson: d.diagnostico_json };
    });
    st.arbolPorModulo = {}; // no viene cacheado desde el servidor; el resumen enriquecido no aplica acá
    st.consultorias = consultorias || [];
    st.moduloRevisionActivo = null;

    document.getElementById('selectorCliente').classList.add('hidden');
    document.getElementById('subwizardConsultoria').classList.remove('hidden');
    document.getElementById('nombreClienteActivo').textContent = cliente.nombre;
    renderJourney('journeyConsultoria', estadoJourneyParaCliente_(true, !!kickOffExistente, consultorias));
    document.getElementById('resumenKickOffConsultoria').innerHTML = renderResumenKickOff_(kickOffExistente);
    if (!kickOffExistente) {
      mostrarToast('Este cliente aún no tiene Kick Off registrado — la consultoría se puede generar igual, pero se personaliza mejor si lo completas primero en "Kick Off COE".', 'exito');
    }

    // Si ya había consultorías generadas para este cliente, entra directo a
    // Revisión; si no, arranca en el paso de generación.
    irAPaso(st.consultorias.length ? 7 : 6);
  }).catch(manejarErrorInesperado_);
}

function cambiarCliente() {
  document.getElementById('subwizardConsultoria').classList.add('hidden');
  document.getElementById('selectorCliente').classList.remove('hidden');
  st.clienteId = null;
  refrescarListaClientes();
}

// ------------------------- Generar consultoría COI --------------------------

function generarConsultoriaCOI() {
  const btn = document.getElementById('btnGenerarConsultoria');
  btn.disabled = true;
  document.getElementById('estadoGeneracion').innerHTML = '';

  const payload = st.diagnosticosPorModulo.map(function (d) { return { modulo: d.modulo, diagnosticoId: d.diagnosticoId }; });

  llamarServidor('apiGenerarConsultoria', st.clienteId, payload).then(function (resultado) {
    st.consultorias = resultado.generadas;
    btn.disabled = false;
    if (resultado.errores && resultado.errores.length) {
      document.getElementById('estadoGeneracion').innerHTML = '<div class="alerta-error">No se pudo generar la consultoría de: ' +
        resultado.errores.map(function (e) { return e.modulo + ' (' + e.error + ')'; }).join('; ') + '</div>';
    }
    mostrarToast('Consultoría generada para ' + resultado.generadas.length + ' módulo(s).', 'exito');
    irAPaso(7);
  }).catch(function (e) { btn.disabled = false; manejarErrorInesperado_(e); });
}

// --------------------------- Revisión de consultoría ------------------------

function renderRevisionConsultoria() {
  if (!st.consultorias.length) { document.getElementById('revisionConsultoria').innerHTML = '<p class="alerta-error">Aún no se ha generado consultoría.</p>'; return; }
  if (st.moduloRevisionActivo === null) st.moduloRevisionActivo = 0;

  document.getElementById('tabsModulos').innerHTML = st.consultorias.map(function (c, i) {
    return '<button class="tab-btn' + (i === st.moduloRevisionActivo ? ' activo' : '') + '" onclick="cambiarTabRevision(' + i + ')">' + escapar(c.modulo) + '</button>';
  }).join('');

  const c = st.consultorias[st.moduloRevisionActivo];
  const j = c.contenido_json;
  const cont = document.getElementById('revisionConsultoria');

  function bloqueTexto(campo, etiqueta, grande) {
    return '<div class="bloque-revision"><h4>' + etiqueta + '</h4><textarea class="' + (grande ? 'textarea-grande' : '') + '" data-campo="' + campo + '" data-tipo="texto">' + escapar(j[campo] || '') + '</textarea></div>';
  }
  function bloqueLista(campo, etiqueta) {
    return '<div class="bloque-revision"><h4>' + etiqueta + ' <span class="hint">(uno por línea)</span></h4><textarea data-campo="' + campo + '" data-tipo="lista">' + (j[campo] || []).join('\n') + '</textarea></div>';
  }

  let html = renderScriptsRecomendados_(c.modulo, st.cliente);
  html += renderSeguimientoHtml_(c);
  html += bloqueTexto('diagnostico', 'Diagnóstico', true);
  html += bloqueLista('necesidades', 'Necesidades');
  html += bloqueLista('oportunidades', 'Oportunidades');
  html += bloqueTexto('consultoria_recomendada', 'Consultoría recomendada', true);
  html += bloqueLista('configuracion_recomendada', 'Configuración recomendada');
  html += bloqueLista('plantillas_sugeridas', 'Plantillas');
  html += bloqueLista('comunicaciones', 'Comunicaciones');
  html += bloqueLista('tareas', 'Tareas');
  html += bloqueTexto('flujo_recomendado', 'Flujo recomendado');
  html += bloqueLista('buenas_practicas', 'Buenas prácticas');
  html += '<div class="bloque-revision"><h4>Prioridad</h4><select data-campo="prioridad" data-tipo="select"><option' + (j.prioridad==='Alta'?' selected':'') + '>Alta</option><option' + (j.prioridad==='Media'?' selected':'') + '>Media</option><option' + (j.prioridad==='Baja'?' selected':'') + '>Baja</option></select></div>';
  html += bloqueLista('primeros_pasos', 'Primeros pasos');

  html += '<div class="bloque-revision"><h4>Propuestas de valor</h4>' + (j.propuestas_valor || []).map(function (p) {
    return '<div class="propuesta-card"><strong>' + escapar(p.necesidad || '') + '</strong><p>' + escapar(p.propuesta_completa || '') + '</p></div>';
  }).join('') + '</div>';

  if (j.trazabilidad && j.trazabilidad.length) {
    html += '<details class="bloque-revision trazabilidad-detalle"><summary>Trazabilidad de la IA</summary>' + j.trazabilidad.map(function (t) {
      return '<div class="fila-origen"><span class="origen-tag origen-' + t.origen + '">' + t.origen.replace('_',' ') + '</span>' + escapar(t.campo) + ' — ' + escapar(t.detalle || '') + '</div>';
    }).join('') + '</details>';
  }

  cont.innerHTML = html;
}

function cambiarTabRevision(i) { st.moduloRevisionActivo = i; renderRevisionConsultoria(); }

/**
 * Checklist "Aplica / No aplica / Requiere ajuste" (sección 5 del rediseño):
 * convierte necesidades + configuración recomendada + tareas en una lista
 * única que el COE recorre junto con el cliente. El estado de cada punto se
 * guarda en contenido_json.seguimiento_json ({ "campo:indice": estado }) sin
 * tocar el resto del contenido — es un seguimiento de la sesión, no una
 * edición del contenido generado por la IA.
 */
function renderSeguimientoHtml_(c) {
  const j = c.contenido_json;
  const seguimiento = c.seguimiento_json || {};

  // Antes se listaban TODAS las necesidades + configuración recomendada + tareas (a veces
  // 10 o más puntos), lo que hacía el checklist agotador de recorrer con el cliente. Ahora
  // se muestran como máximo 3 puntos MUY estratégicos por módulo: el primero de cada
  // categoría (necesidades, configuración recomendada, tareas) — que suele ser el más
  // relevante, porque la IA ya los devuelve en orden de prioridad — y solo se completa con
  // un punto adicional de la misma categoría si alguna de las otras quedó vacía.
  const categorias = [
    (j.necesidades || []).map(function (t, i) { return { key: 'necesidades:' + i, texto: t }; }),
    (j.configuracion_recomendada || []).map(function (t, i) { return { key: 'configuracion_recomendada:' + i, texto: t }; }),
    (j.tareas || []).map(function (t, i) { return { key: 'tareas:' + i, texto: t }; })
  ];
  let puntos = categorias.map(function (arr) { return arr[0]; }).filter(Boolean);
  if (puntos.length < 3) {
    categorias.forEach(function (arr) {
      for (let i = 1; i < arr.length && puntos.length < 3; i++) puntos.push(arr[i]);
    });
  }
  puntos = puntos.slice(0, 3);
  if (!puntos.length) return '';

  const opciones = [['aplica', '✓ Aplica'], ['ajustar', '✎ Ajustar'], ['no_aplica', '✕ No aplica']];
  return '<div class="seguimiento-bloque"><h4>✅ Checklist con el cliente</h4><p class="hint" style="margin-top:0">Los 3 puntos más estratégicos de este módulo — recórrelos con el cliente y marca qué aplica, qué necesita ajuste y qué no aplica.</p>' +
    puntos.map(function (p) {
      const activo = seguimiento[p.key];
      return '<div class="seguimiento-item"><span class="seguimiento-texto">' + escapar(p.texto) + '</span>' +
        '<div class="seguimiento-controles">' + opciones.map(function (o) {
          return '<button type="button" class="seguimiento-btn ' + o[0] + (activo === o[0] ? ' activo' : '') + '" onclick="marcarSeguimiento(\'' + p.key + '\',\'' + o[0] + '\')">' + o[1] + '</button>';
        }).join('') + '</div></div>';
    }).join('') + '</div>';
}

function marcarSeguimiento(key, valor) {
  const c = st.consultorias[st.moduloRevisionActivo];
  if (!c.seguimiento_json) c.seguimiento_json = {};
  c.seguimiento_json[key] = (c.seguimiento_json[key] === valor) ? undefined : valor; // clic de nuevo = desmarcar
  llamarServidor('apiGuardarSeguimientoConsultoria', c.id, c.seguimiento_json).catch(manejarErrorInesperado_);
  renderRevisionConsultoria();
}

function guardarRevision() {
  const c = st.consultorias[st.moduloRevisionActivo];
  const j = Object.assign({}, c.contenido_json);
  document.querySelectorAll('#revisionConsultoria [data-campo]').forEach(function (el) {
    const campo = el.getAttribute('data-campo');
    const tipo = el.getAttribute('data-tipo');
    if (tipo === 'lista') j[campo] = el.value.split('\n').map(function (s) { return s.trim(); }).filter(Boolean);
    else j[campo] = el.value;
  });
  llamarServidor('apiGuardarEdicionConsultoria', c.id, j).then(function (registroActualizado) {
    st.consultorias[st.moduloRevisionActivo] = registroActualizado;
    mostrarToast('Cambios guardados para ' + c.modulo + '.', 'exito');
  }).catch(manejarErrorInesperado_);
}

// ------------------------------ Aprobación -----------------------------

function renderAprobacion() {
  document.getElementById('listaAprobacion').innerHTML = st.consultorias.map(function (c) {
    return '<div class="fila-aprobacion"><div><strong>' + escapar(c.modulo) + '</strong><div class="hint">Prioridad: ' + escapar(c.contenido_json.prioridad || '-') + '</div></div>' +
      '<span class="estado-pill">' + escapar(c.estado) + '</span></div>';
  }).join('');
}

function aprobarTodas() {
  const promesas = st.consultorias.map(function (c) { return llamarServidor('apiAprobarConsultoria', c.id, c.contenido_json); });
  Promise.all(promesas).then(function (actualizadas) {
    st.consultorias = actualizadas;
    mostrarToast('Consultoría aprobada.', 'exito');
    irAPaso(9);
  }).catch(manejarErrorInesperado_);
}

// ---------------------------- Generar entregable -------------------------

function renderEntregable() {
  document.getElementById('listaEntregable').innerHTML = st.consultorias.map(function (c) {
    const aprobada = c.estado === 'Aprobada' || c.estado === 'Entregada';
    return '<div class="fila-entregable"><label style="display:flex;align-items:center;gap:10px;margin:0;">' +
      '<input type="checkbox" style="width:auto" data-consultoria="' + c.id + '"' + (aprobada ? ' checked' : ' disabled') + '>' +
      escapar(c.modulo) + (aprobada ? '' : ' <span class="hint">(no aprobada)</span>') + '</label>' +
      '<span class="estado-pill">' + escapar(c.estado) + '</span></div>';
  }).join('');
}

function generarEntregableFinal() {
  const seleccionadas = Array.prototype.slice.call(document.querySelectorAll('#listaEntregable input:checked')).map(function (c) { return c.getAttribute('data-consultoria'); });
  if (seleccionadas.length === 0) { mostrarToast('Selecciona al menos una consultoría aprobada.', 'error'); return; }

  llamarServidor('apiGenerarEntregable', st.clienteId, seleccionadas, 'PDF').then(function (entregable) {
    document.getElementById('resultadoEntregable').innerHTML =
      '<div class="tarjeta-resumen"><h3>Entregable en PDF generado</h3><p>El documento se guardó en Google Drive:</p>' +
      '<p><a href="' + entregable.url + '" target="_blank">' + entregable.url + '</a></p></div>';
    mostrarToast('Entregable generado con éxito.', 'exito');
  }).catch(manejarErrorInesperado_);
}

// ---------------- Playbook y Presentación Ejecutiva (Gema COE) ------------------
// Paso 9: además del entregable PDF de la consultoría, el COE puede generar un
// Playbook Técnico (y, si quiere, la Presentación Ejecutiva) con el contenido
// que trae de su Gema de Gemini — ver GemaIntegracion.gs / apiGenerarPlaybookYNotificar
// / apiGenerarEntregablesDuales en Code.gs.

function leerDatosGemaCOE_() {
  return {
    entregablesTecnicos: document.getElementById('gema_entregables').value.trim(),
    oportunidadesFuturas: document.getElementById('gema_oportunidades').value.trim(),
    resumenPresentacion: document.getElementById('gema_resumen_ppt').value.trim()
  };
}

function generarPlaybookCOE() {
  if (!st.clienteId) { mostrarToast('Selecciona primero un cliente.', 'error'); return; }
  const datosGema = leerDatosGemaCOE_();
  const cont = document.getElementById('resultadoGemaCOE');
  if (cont) cont.innerHTML = '<p class="hint">Generando el Playbook y enviándolo a tu correo…</p>';
  llamarServidor('apiGenerarPlaybookYNotificar', st.clienteId, datosGema).then(function (res) {
    if (cont) cont.innerHTML = '<div class="tarjeta-resumen"><h3>Playbook enviado</h3><p>' + escapar(res.mensaje) + '</p>' +
      '<p><a href="' + res.pdfUrl + '" target="_blank">' + res.pdfUrl + '</a></p></div>';
    mostrarToast('Playbook generado y enviado a tu correo.', 'exito');
  }).catch(function (e) {
    if (cont) cont.innerHTML = '';
    manejarErrorInesperado_(e);
  });
}

function descargarEntregablesDuales() {
  if (!st.clienteId) { mostrarToast('Selecciona primero un cliente.', 'error'); return; }
  const datosGema = leerDatosGemaCOE_();
  const cont = document.getElementById('resultadoGemaCOE');
  if (cont) cont.innerHTML = '<p class="hint">Generando el Playbook y la Presentación…</p>';
  llamarServidor('apiGenerarEntregablesDuales', st.clienteId, datosGema).then(function (res) {
    if (cont) cont.innerHTML = '<div class="tarjeta-resumen"><h3>Entregables generados</h3>' +
      '<p>📄 Playbook Técnico: <a href="' + res.pdfUrl + '" target="_blank">ver</a> · <a href="' + res.pdfDownloadUrl + '" target="_blank">descargar</a></p>' +
      '<p>📊 Presentación Ejecutiva: <a href="' + res.pptUrl + '" target="_blank">ver</a> · <a href="' + res.pptDownloadUrl + '" target="_blank">descargar</a></p></div>';
    mostrarToast('Playbook y Presentación generados con éxito.', 'exito');
  }).catch(function (e) {
    if (cont) cont.innerHTML = '';
    manejarErrorInesperado_(e);
  });
}

// --------------------------------- Utilidades -----------------------------------

function escapar(texto) {
  return String(texto == null ? '' : texto).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
